<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پیش‌نمایش استیکرهای دنگ</title>
  <style>
    :root {
      --bg: #f4f7f6;
      --surface: #fff;
      --text: #0f1a17;
      --muted: #3d4c47;
      --line: #c9d4cf;
      --primary: #0d6b63;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 80px;
      line-height: 1.5;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .lead { color: var(--muted); margin: 0 0 24px; max-width: 40rem; }
    section { margin-bottom: 28px; }
    h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .where { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .card {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 14px 12px 12px;
      text-align: center;
      cursor: pointer;
      font: inherit;
      color: inherit;
      transition: border-color .15s, transform .15s;
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--primary) 45%, var(--line));
      transform: translateY(-2px);
    }
    .card.is-on {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    .art {
      height: 88px;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
      pointer-events: none;
    }
    .art svg { width: 72px; height: 72px; display: block; }
    .code { font-weight: 800; color: var(--primary); font-size: 0.9rem; pointer-events: none; }
    .title { font-weight: 700; font-size: 0.92rem; margin-top: 2px; pointer-events: none; }
    .vibe { color: var(--muted); font-size: 0.78rem; margin-top: 2px; pointer-events: none; }
    .bar {
      position: sticky;
      bottom: 12px;
      margin: 28px auto 0;
      max-width: 52rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 28px rgba(15, 26, 23, 0.08);
      z-index: 5;
    }
    .bar code {
      font-size: 0.92rem;
      background: #eef5f3;
      padding: 6px 10px;
      border-radius: 8px;
      direction: ltr;
      display: inline-block;
      user-select: all;
    }
    button.copy {
      border: none;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    button.copy:disabled { opacity: .45; cursor: not-allowed; }
    .err {
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ffe9e6;
      color: #8a241c;
      display: none;
    }
  </style>
</head>
<body>
  <h1>پیش‌نمایش تصویری استیکرها</h1>
  <p class="lead">روی هر کارت کلیک کن تا انتخاب شود. در پایان کدها را کپی کن و در چت بفرست.</p>
  <div class="err" id="err"></div>
  <div id="root"></div>
  <div class="bar">
    <div>
      <div style="font-size:0.8rem;color:var(--muted)">انتخاب تو برای چت:</div>
      <code id="out">هنوز انتخابی نیست</code>
    </div>
    <button type="button" class="copy" id="copyBtn" disabled>کپی کدها</button>
  </div>

    function art(id) {
      try {
        const fn = icons[id];
        if (!fn) return "<span style='color:#b91c1c'>ناموجود</span>";
        return fn();
      } catch (e) {
        return "<span style='color:#b91c1c'>خطا</span>";
      }
    }

    function render() {
      try {
        root.innerHTML = slots.map(function (slot) {
          const cards = slot.ids.map(function (id, i) {
            const on = picks[slot.id] === id ? " is-on" : "";
            return (
              '<button type="button" class="card' + on + '" data-slot="' + slot.id + '" data-id="' + id + '">' +
              '<div class="art">' + art(id) + "</div>" +
              '<div class="code">' + id + "</div>" +
              '<div class="title">' + slot.titles[i] + "</div>" +
              '<div class="vibe">' + slot.vibes[i] + "</div>" +
              "</button>"
            );
          }).join("");
          return (
            "<section><h2>" + slot.label + "</h2>" +
            '<p class="where">' + slot.where + "</p>" +
            '<div class="grid">' + cards + "</div></section>"
          );
        }).join("");
        err.style.display = "none";
      } catch (e) {
        err.style.display = "block";
        err.textContent = "خطا در رندر: " + e.message;
      }
      sync();
    }

    function sync() {
      const codes = slots.map(function (s) { return picks[s.id]; }).filter(Boolean);
      out.textContent = codes.length ? codes.join(" ") : "هنوز انتخابی نیست";
      copyBtn.disabled = codes.length === 0;
    }

    root.addEventListener("click", function (e) {
      const btn = e.target.closest(".card");
      if (!btn || !root.contains(btn)) return;
      picks[btn.getAttribute("data-slot")] = btn.getAttribute("data-id");
      render();
    });

    copyBtn.addEventListener("click", async function () {
      const text = out.textContent;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        copyBtn.textContent = "کپی شد";
        setTimeout(function () { copyBtn.textContent = "کپی کدها"; }, 1200);
      } catch (e) {
        err.style.display = "block";
        err.textContent = "کپی نشد — کد را دستی از پایین صفحه بردار: " + text;
      }
    });

    render();
  </script>
</body>
</html>
