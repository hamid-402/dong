name: dast-zap

# R10-02 — OWASP ZAP baseline (on-demand / scheduled when target configured)
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL to scan (e.g. https://staging.example)"
        required: false
        type: string
  schedule:
    # Mondays 06:00 UTC — only useful when ZAP_TARGET_URL secret is set
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ inputs.target_url }}
          SECRET_URL: ${{ secrets.ZAP_TARGET_URL }}
        run: |
          url="${INPUT_URL:-}"
          if [ -z "$url" ]; then
            url="${SECRET_URL:-}"
          fi
          if [ -z "$url" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=ZAP skipped::Set workflow input target_url or repository secret ZAP_TARGET_URL"
            {
              echo "## ZAP baseline skipped"
              echo "No target URL. Provide \`target_url\` on workflow_dispatch or set secret \`ZAP_TARGET_URL\`."
              echo "Runbook: \`docs/ops/DAST-ZAP.md\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: ZAP Baseline
        if: steps.target.outputs.skip != 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          allow_issue_writing: false
          fail_action: false
          cmd_options: "-I"

      - name: Upload ZAP report
        if: steps.target.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report_html.html
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: steps.target.outputs.skip != 'true' && always()
        run: |
          {
            echo "## ZAP baseline"
            echo "- target: \`${{ steps.target.outputs.url }}\`"
            echo "- fail_action: false (triage artifact; raise fail_action after staging is stable)"
            echo "- runbook: \`docs/ops/DAST-ZAP.md\`"
            echo "- ASVS evidence: \`docs/security/ASVS-L2-EVIDENCE.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
