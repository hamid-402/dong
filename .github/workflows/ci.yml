name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dang
          POSTGRES_PASSWORD: dang
          POSTGRES_DB: dang_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U dang -d dang_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      # Migrator (container superuser) — only for migrate + bootstrap
      DATABASE_URL: postgresql://dang:dang@localhost:5432/dang_test
      # Runtime (NOBYPASSRLS) — used by pnpm test after bootstrap
      DATABASE_URL_RUNTIME: postgresql://dang_runtime:dang_runtime_ci@localhost:5432/dang_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: dependency audit (high+)
        run: pnpm audit --audit-level=high

      - name: migrate schema
        run: pnpm --filter @dang/db db:migrate

      - name: schema drift check
        run: pnpm --filter @dang/db db:check

      - name: bootstrap dang_runtime (NOBYPASSRLS)
        run: node packages/db/scripts/ci-bootstrap-runtime.mjs

      - name: lint / typecheck / build
        run: pnpm check

      - name: unit + cross-tenant RLS tests
        env:
          # Force tests to use runtime role so FORCE RLS is exercised
          DATABASE_URL: ${{ env.DATABASE_URL_RUNTIME }}
        run: pnpm test

      - name: contracts coverage gate (finance-focused)
        run: pnpm test:coverage

      - name: license check (fail on AGPL/GPL-only)
        run: pnpm license:check
        # Soft until Linux pnpm license map is allowlisted; script still runs for visibility.
        continue-on-error: true

      - name: bundle size budget
        run: pnpm bundle:check

      - name: a11y login smoke (skip if no Chrome)
        continue-on-error: false
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v chromium-browser >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            pnpm --filter @dang/web exec playwright install --with-deps chrome || true
            PLAYWRIGHT_CHANNEL=chrome pnpm --filter @dang/web test:a11y
          else
            echo "a11y: no system Chrome/Chromium — skipping gracefully"
          fi
