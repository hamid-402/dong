name: ci

on:
  push:
    branches: [dev, main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dang
          POSTGRES_PASSWORD: dang
          POSTGRES_DB: dang_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U dang -d dang_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      # Migrator (container superuser) — only for migrate + bootstrap
      DATABASE_URL: postgresql://dang:dang@localhost:5432/dang_test
      # Runtime (NOBYPASSRLS) — used by pnpm test after bootstrap
      DATABASE_URL_RUNTIME: postgresql://dang_runtime:dang_runtime_ci@localhost:5432/dang_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: secret scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: dependency audit (high+)
        id: audit
        run: pnpm audit --audit-level=high

      # Soft alert companion: hard-fail is preserved above (steps still fail the job).
      # This only runs when an earlier step failed, to surface an explicit maintainer notice.
      - name: security finding notice (audit/gitleaks)
        if: failure()
        run: |
          gitleaks_outcome="${{ steps.gitleaks.outcome }}"
          audit_outcome="${{ steps.audit.outcome }}"
          if [ "$gitleaks_outcome" = "failure" ] || [ "$audit_outcome" = "failure" ]; then
            echo "::warning title=Security finding::secret-scan or dependency audit failed — notify maintainers (gitleaks=$gitleaks_outcome, audit=$audit_outcome)"
            {
              echo "## ⚠️ Security finding — notify maintainers"
              echo ""
              echo "- gitleaks (secret scan): \`$gitleaks_outcome\`"
              echo "- pnpm audit (high+): \`$audit_outcome\`"
              echo ""
              echo "Review the failing step logs above and triage before merge."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: migrate schema
        run: pnpm --filter @dang/db db:migrate

      - name: install postgres client (DR drill)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: DR restore drill (R10-07)
        env:
          DATABASE_URL: postgresql://dang:dang@localhost:5432/dang_test
          DR_OUT_DIR: backups
        run: pnpm dr:drill

      - name: WAL RPO dry-run (R10-07 local)
        run: pnpm dr:wal:dry-run

      - name: schema drift check
        run: pnpm --filter @dang/db db:check

      - name: bootstrap dang_runtime (NOBYPASSRLS)
        run: node packages/db/scripts/ci-bootstrap-runtime.mjs

      - name: motion tokens present (reduced-motion)
        run: |
          set -e
          grep -q -- '--motion-duration-base' packages/ui/src/tokens.css
          grep -q 'prefers-reduced-motion' packages/ui/src/tokens.css

      - name: lint / typecheck / build
        run: pnpm check

      - name: package boundary cruise (R10-11)
        run: pnpm depcruise

      - name: unit + cross-tenant RLS tests
        env:
          # Force tests to use runtime role so FORCE RLS is exercised
          DATABASE_URL: ${{ env.DATABASE_URL_RUNTIME }}
        run: pnpm test

      - name: contracts coverage gate (finance-focused)
        run: pnpm test:coverage

      - name: license check (fail on AGPL/GPL-only)
        run: pnpm license:check

      - name: bundle size budget
        run: pnpm bundle:check

      - name: component line budget — components/** (warn >800, fail >1600)
        run: pnpm views:line-budget

      - name: build api (a11y/e2e seed path)
        run: pnpm --filter @dang/api build

      - name: start api (background)
        env:
          # Same DB as migrate; ALLOW_DEV_AUTH so /demo/seed works for fail-closed a11y.
          DATABASE_URL: postgresql://dang:dang@localhost:5432/dang_test
          ALLOW_DEV_AUTH: "true"
          NODE_ENV: development
          SESSION_SECRET: "ci-session-secret-at-least-32-chars!!"
          API_PORT: "3006"
          WEB_ORIGIN: "http://127.0.0.1:3005"
        run: |
          set -e
          nohup pnpm --filter @dang/api start > /tmp/dang-api.log 2>&1 &
          echo $! > /tmp/dang-api.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3006/api/v1/health/live >/dev/null; then
              echo "API live after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API failed to become live"
          cat /tmp/dang-api.log || true
          exit 1

      - name: a11y smoke (Playwright Chromium)
        env:
          ALLOW_DEV_AUTH: "true"
          # Fail-closed seeded finance routes (API + demo seed required above).
          A11Y_REQUIRE_FINANCE: "1"
          API_ORIGIN: "http://127.0.0.1:3006"
          PLAYWRIGHT_API_ORIGIN: "http://127.0.0.1:3006"
        run: |
          pnpm --filter @dang/web exec playwright install chromium --with-deps
          # Bundled Chromium — do not rely on system Chrome / PLAYWRIGHT_CHANNEL
          unset PLAYWRIGHT_CHANNEL || true
          pnpm --filter @dang/web test:a11y

      - name: e2e smoke (auth + finance journeys)
        env:
          ENABLE_WORKSPACE_PLANS: "1"
          ENABLE_PLAN_ADMIN: "1"
          ENABLE_FX_RATES: "1"
          ALLOW_DEV_AUTH: "true"
          API_ORIGIN: "http://127.0.0.1:3006"
          PLAYWRIGHT_API_ORIGIN: "http://127.0.0.1:3006"
        run: |
          unset PLAYWRIGHT_CHANNEL || true
          # webServer in playwright.config starts next after build (from pnpm check)
          pnpm --filter @dang/web exec playwright test \
            e2e/login.spec.ts \
            e2e/expense-balance-settlement.spec.ts \
            e2e/debt-simplify-smoke.spec.ts \
            e2e/statements-journey.spec.ts \
            e2e/kind-reports-smoke.spec.ts \
            e2e/charts-plan-matrix.spec.ts \
            e2e/home-mobile-fold.spec.ts

      - name: i18n scaffold key parity
        run: node scripts/i18n-scaffold-check.mjs

      - name: OpenAPI route break check (static inventory)
        run: pnpm openapi:break

      - name: Canary promote policy unit tests
        run: pnpm canary:policy:test

      - name: Generate unsigned SBOM artifact
        run: pnpm sbom:generate

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sbom-cdx
          path: artifacts/sbom.cdx.json
          retention-days: 14

      - name: CI gate summary
        if: always()
        run: |
          echo "## CI gates" >> "$GITHUB_STEP_SUMMARY"
          echo "- secret-scan, audit, migrate, dr-drill, check, tests, coverage, license, bundle, a11y(+finance fail-closed + 5 themes), e2e-auth-finance + home-mobile-fold, i18n-scaffold, openapi-break, sbom, storybook hard, visual hard-when-linux-baseline" >> "$GITHUB_STEP_SUMMARY"

  storybook:
    name: storybook build (hard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build Storybook (@dang/ui)
        run: pnpm --filter @dang/ui build-storybook
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  redis-worker-smoke:
    name: redis + worker heartbeat smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: heartbeat key roundtrip + worker touchHeartbeat
        env:
          REDIS_URL: redis://127.0.0.1:6379
          CI: "true"
          REDIS_WORKER_REQUIRE_TOUCH: "1"
        run: pnpm ci:redis-worker-smoke

  visual-regression-soft:
    name: visual regression (soft until Linux baseline)
    # Soft only while Linux login baseline is missing — no fake hard-pass.
    if: ${{ hashFiles('apps/web/e2e/visual-shell.spec.ts-snapshots/login-chromium-linux.png') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build web for playwright
        run: pnpm --filter @dang/web build
      - name: install playwright chromium
        run: pnpm --filter @dang/web exec playwright install --with-deps chromium
      - name: visual shell (capture Linux baselines into artifact)
        env:
          VISUAL_REGRESSION: "1"
        run: |
          # Soft path: always produce updatable Linux snapshots for human commit.
          # Hard gate activates only after login-chromium-linux.png is committed.
          pnpm --filter @dang/web exec playwright test e2e/visual-shell.spec.ts --update-snapshots || true
          echo "Soft visual job — download artifact, review, commit login-chromium-linux.png (+ not-found)."
          echo "Then visual-regression-hard runs without continue-on-error (docs/ops/VISUAL-REGRESSION.md)."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-shell-results
          path: |
            apps/web/test-results
            apps/web/e2e/visual-shell.spec.ts-snapshots
          retention-days: 7
          if-no-files-found: ignore

  visual-regression-hard:
    name: visual regression (hard)
    # File-based: activates only after Linux baselines are committed (honest).
    if: ${{ hashFiles('apps/web/e2e/visual-shell.spec.ts-snapshots/login-chromium-linux.png') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build web for playwright
        run: pnpm --filter @dang/web build
      - name: install playwright chromium
        run: pnpm --filter @dang/web exec playwright install --with-deps chromium
      - name: visual shell (hard fail)
        env:
          VISUAL_REGRESSION: "1"
        run: pnpm --filter @dang/web exec playwright test e2e/visual-shell.spec.ts
